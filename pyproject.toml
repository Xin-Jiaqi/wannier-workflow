[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wannier-workflow"
version = "0.6.0"
description = "Deterministic, AI-free POSCAR-to-Wannier workflow core"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "matplotlib>=3.7"]

[project.scripts]
w90flow = "w90flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
