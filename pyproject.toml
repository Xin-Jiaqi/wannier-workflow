[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wannier-workflow"
version = "0.6.0"
description = "Deterministic, AI-free POSCAR-to-Wannier workflow core"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "matplotlib>=3.7"]

[project.optional-dependencies]
materials = ["ase>=3.22"]
test = ["mypy>=1.11"]

[project.scripts]
w90flow = "w90flow.cli:main"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = ["ase.*"]
ignore_missing_imports = true
